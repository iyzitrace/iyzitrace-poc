# Settings for the PoC's Grafana, for the Grafana Helm chart. Install it as described in README.md.
#
# Most of this file is the same everywhere. A few places depend on your cluster; they are marked
# EDIT, with the lines to change or to uncomment (remove the # at the start of the line):
#   EDIT: OpenShift       an OpenShift cluster
#   EDIT: registry        the cluster may pull images only from your own registry
#   EDIT: proxy           the cluster reaches GitHub through a proxy
#   EDIT: certificate     the platform's Route has a certificate signed by the cluster's own CA
# Leave them as they are on plain Kubernetes with direct internet access.

# EDIT: OpenShift. OpenShift gives the pod a user id of its own, but the chart sets a fixed one (472).
# Uncomment the next four lines and, below, set initChownData.enabled to false.
# securityContext:
#   runAsUser: null
#   runAsGroup: null
#   fsGroup: null

image:
  # The Grafana version the IyziTrace plugin is developed against (it needs 12.3 or later).
  tag: "13.1.1"
  # EDIT: registry. Uncomment the next two lines and replace REGISTRY with your registry's address,
  # for example registry.example.com. The image keeps its original address after it.
  # registry: REGISTRY/docker.io
  # repository: grafana/grafana

# The init container that fixes the volume's owner. It needs root, so OpenShift must not run it.
initChownData:
  enabled: true     # EDIT: OpenShift. Change to false.
  # EDIT: registry. Uncomment the next three lines (replace REGISTRY as above).
  # image:
  #   registry: REGISTRY/docker.io
  #   repository: library/busybox

admin:
  # Created in step 1 of README.md.
  existingSecret: grafana-admin

# One pod, one ReadWriteOnce disk: stop the old pod before the new one starts, so an upgrade never waits for the disk.
deploymentStrategy:
  type: Recreate

service:
  port: 3000

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 1Gi

# Installed when the pod starts, all three from GitHub releases (nothing is fetched from grafana.com).
# The Infinity zip is for amd64; on an arm64 cluster use linux_arm64 in its address.
plugins:
  - yesoreyeram-infinity-datasource@4.1.1@https://github.com/grafana/grafana-infinity-datasource/releases/download/v4.1.1/yesoreyeram-infinity-datasource-4.1.1.linux_amd64.zip
  - ae3e-plotly-panel@0.5.0@https://github.com/ae3e/ae3e-plotly-panel/releases/download/v0.5.0/ae3e-plotly-panel-0.5.0.zip
  - antreklabs-iyzitrace-app@1.3.1@https://github.com/iyzitrace/iyzitrace-poc/releases/download/grafana-plugin-dev.de49fe9/antreklabs-iyzitrace-app-1.3.1-dev.de49fe9.zip

grafana.ini:
  plugins:
    # The plugin build from the dev branch is not signed. Only this plugin may load unsigned.
    allow_loading_unsigned_plugins: antreklabs-iyzitrace-app

env:
  # Grafana's own plugin set and update checks would go to grafana.com.
  GF_PLUGINS_PREINSTALL: ""
  GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
  GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
  GF_ANALYTICS_REPORTING_ENABLED: "false"
  # EDIT: proxy. Uncomment the next three lines and replace PROXY-HOST:PORT with the proxy's address.
  # Add the host name of the platform's Route to NO_PROXY if it is reached without the proxy.
  # HTTPS_PROXY: http://PROXY-HOST:PORT
  # HTTP_PROXY: http://PROXY-HOST:PORT
  # NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local
  # EDIT: certificate. Uncomment the next line and the extraConfigmapMounts lines further down.
  # SSL_CERT_DIR: /etc/platform-ca
  # idForwarding: Grafana sends the signed-in user's identity to the platform.
  # Agent Manager, the AI settings and team authorization need it.
  GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,idForwarding

# Turns the IyziTrace plugin on, so nobody has to do it in the UI.
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-provisioning-apps
    data:
      apps.yaml: |
        apiVersion: 1
        apps:
          - type: antreklabs-iyzitrace-app
            org_id: 1
            disabled: false
extraVolumes:
  - name: provisioning-apps
    configMap:
      name: grafana-provisioning-apps
extraVolumeMounts:
  - name: provisioning-apps
    mountPath: /etc/grafana/provisioning/plugins

# EDIT: certificate. Uncomment these lines (README.md, last section, creates the ConfigMap).
# extraConfigmapMounts:
#   - name: platform-ca
#     mountPath: /etc/platform-ca
#     configMap: platform-ca
#     readOnly: true

testFramework:
  enabled: false
