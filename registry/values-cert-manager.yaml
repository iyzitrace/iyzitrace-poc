# cert-manager chart: its images from the organisation's own registry.
# Replace REGISTRY with your registry's address (every occurrence). Use it as one more -f on
# the cert-manager install, after values-cert-manager.yaml.

image:
  repository: REGISTRY/quay.io/jetstack/cert-manager-controller
webhook:
  image:
    repository: REGISTRY/quay.io/jetstack/cert-manager-webhook
cainjector:
  image:
    repository: REGISTRY/quay.io/jetstack/cert-manager-cainjector
startupapicheck:
  image:
    repository: REGISTRY/quay.io/jetstack/cert-manager-startupapicheck
# The pod cert-manager starts to answer an ACME challenge (not used by the PoC, which uses
# its own CA).
acmesolver:
  image:
    repository: REGISTRY/quay.io/jetstack/cert-manager-acmesolver
