# Settings of the OpenTelemetry Java agent. The server loads this file with the JVM option
#   -Dotel.javaagent.configuration-file=/opt/otel/otel-agent.properties
# See docs/04-java-agent.md.

# --- Change these two lines for each server ---------------------------------------------------
# A name for this server, e.g. tomcat-orders-01. JVM metrics and the server's own logs appear
# under it; each application gets its own service name from the extension.
otel.service.name=CHANGE-ME-server-name
# service.namespace: the application landscape this server belongs to, e.g. orders.
# Use the same value on all servers of one landscape.
otel.resource.attributes=service.namespace=CHANGE-ME-namespace,deployment.environment.name=poc

# --- Where the data goes: the collector on this machine --------------------------------------
otel.exporter.otlp.endpoint=http://127.0.0.1:4318
otel.exporter.otlp.protocol=http/protobuf
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.metric.export.interval=30000

# --- Keep every trace (fine for a PoC) -------------------------------------------------------
# Under heavy load, keep 10% instead:
#   otel.traces.sampler=parentbased_traceidratio
#   otel.traces.sampler.arg=0.1
otel.traces.sampler=parentbased_always_on

# --- More detailed JVM metrics ---------------------------------------------------------------
otel.instrumentation.runtime-telemetry.emit-experimental-telemetry=true

# --- Optional: traces for chosen business methods, without code changes ----------------------
# otel.instrumentation.methods.include=com.example.OrderService[place,cancel];com.example.Billing[charge]
