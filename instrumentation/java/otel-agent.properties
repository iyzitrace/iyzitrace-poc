# OpenTelemetry Java agent settings, loaded with
#   -Dotel.javaagent.configuration-file=/opt/otel/otel-agent.properties
# One file per app server instance (copy it if one host runs several instances).
# A -Dotel.* JVM option or an OTEL_* environment variable overrides the same key here.

# --- Identity: CHANGE these two per app server instance -------------------------------------
# The server-wide service name. With the appserver-deployment extension and this repository's
# collector config, each application gets its own service.name (context root or declared name);
# this value is used for work outside any application and as the fallback.
otel.service.name=CHANGE-ME-server-name
# service.namespace groups the services of one application landscape in IyziTrace (Atlas, Horizon).
# deployment.environment.name separates environments.
otel.resource.attributes=service.namespace=CHANGE-ME-namespace,deployment.environment.name=poc

# --- Where to send: the collector on this host -----------------------------------------------
otel.exporter.otlp.endpoint=http://127.0.0.1:4318
otel.exporter.otlp.protocol=http/protobuf
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.metric.export.interval=30000

# The iyzitrace extension is loaded with a JVM option next to -javaagent
# (-Dotel.javaagent.extensions=...), as its documentation says; see java/appservers/.

# --- Sampling: everything (PoC). For production load, e.g. parentbased_traceidratio + 0.1 ------
otel.traces.sampler=parentbased_always_on

# --- JVM metrics, more detail ----------------------------------------------------------------
otel.instrumentation.runtime-telemetry.emit-experimental-telemetry=true

# --- Optional: spans for chosen business methods (no code change) ----------------------------
# otel.instrumentation.methods.include=com.example.OrderService[place,cancel];com.example.Billing[charge]
