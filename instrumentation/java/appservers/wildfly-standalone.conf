# WildFly / JBoss EAP (standalone): append to $JBOSS_HOME/bin/standalone.conf
# (domain mode: add the same options to the server group's <jvm-options> in domain.xml / host.xml).
#
# JBoss Modules needs the agent's packages on the system package list, and JBoss LogManager must be
# known before the agent starts, otherwise the server fails at boot with a LogManager error.

OTEL_HOME=/opt/otel
JAVA_OPTS="$JAVA_OPTS -javaagent:$OTEL_HOME/opentelemetry-javaagent.jar"
JAVA_OPTS="$JAVA_OPTS -Dotel.javaagent.configuration-file=$OTEL_HOME/otel-agent.properties"
JAVA_OPTS="$JAVA_OPTS -Dotel.javaagent.extensions=$OTEL_HOME/extensions/appserver-deployment-extension.jar"

# Only if the server does not start with the agent (java.util.logging.manager / LogManager errors):
# JAVA_OPTS="$JAVA_OPTS -Djava.util.logging.manager=org.jboss.logmanager.LogManager"
# JAVA_OPTS="$JAVA_OPTS -Djboss.modules.system.pkgs=org.jboss.byteman,org.jboss.logmanager,io.opentelemetry"
# JAVA_OPTS="$JAVA_OPTS -Xbootclasspath/a:$(ls $JBOSS_HOME/modules/system/layers/base/org/jboss/logmanager/main/jboss-logmanager-*.jar)"
