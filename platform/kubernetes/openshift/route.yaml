# The only entry point: nginx, exposed through an OpenShift Route with TLS at the router (edge).
#   oc -n iyzitrace apply -f openshift/route.yaml
# Without spec.host, OpenShift assigns <name>-<namespace>.<apps domain>; set host for a fixed name.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: iyzitrace
  namespace: iyzitrace
  annotations:
    # OpAMP WebSocket sessions and long queries; the router's default is 30s.
    haproxy.router.openshift.io/timeout: 5m
spec:
  # host: iyzitrace.apps.example.com
  to:
    kind: Service
    name: nginx
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
