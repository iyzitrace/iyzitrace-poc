# Settings for the PoC. Change the two URLs, then install the platform as described in README.md, step 6.

authService:
  # The customer's Grafana, as the cluster can reach it.
  # The platform checks Grafana administrators against it (Agent Manager, AI settings).
  grafanaUrl: https://grafana.customer.example
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 512Mi}

lawrence:
  # Where collectors outside the cluster send their own metrics and logs:
  # https://<route-host>/ingest/opamp/v1/telemetry/  (keep the slash at the end)
  agentHttpEndpoint: https://ROUTE-HOST/ingest/opamp/v1/telemetry/
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 256Mi}

# Only on Kubernetes with an Ingress controller. On OpenShift, keep enabled: false and use a Route.
nginx:
  ingress:
    enabled: false
    className: nginx
    host: ROUTE-HOST
    annotations: {}
    tlsSecretName: ""
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 250m, memory: 128Mi}

# --- CPU and memory ------------------------------------------------------------------
# Smaller than the chart's own values, which are small already: enough for a handful of
# servers sending data. Every container must have requests and limits (OpenShift quotas
# refuse pods without them). If a pod is restarted with `OOMKilled`
# (kubectl -n iyzitrace get pods; kubectl -n iyzitrace describe pod <pod>), raise that
# component's memory limit here; a component that is slow and shows CPU at its limit
# (kubectl -n iyzitrace top pods) needs a higher CPU limit.

