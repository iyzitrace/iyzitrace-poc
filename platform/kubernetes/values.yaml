# Settings for the PoC: one file for the operators (step 3), the object store (step 4) and the platform
# (step 6) of README.md. Each chart reads only the keys it knows and ignores the rest, so the same file is
# given to all three `helm` commands. (cert-manager has its own file, values-cert-manager.yaml: its chart
# refuses keys it does not know.)
#
# You must set two addresses, both below: authService.grafanaUrl (the customer's Grafana) and
# lawrence.agentHttpEndpoint (the platform's public address).
# A few more places depend on your cluster; they are marked EDIT, with the lines to uncomment (remove the
# # at the start of the line; a whole block can be selected and toggled in an editor):
#   EDIT: proxy      the pods that reach the internet (auth-service, ai-gateway) go through an HTTP proxy
#   EDIT: registry   the cluster may pull images only from your own registry
# Leave them as they are on a cluster with direct internet access and no registry restriction.

authService:
  # The customer's Grafana, as the cluster can reach it.
  # The platform checks Grafana administrators against it (Agent Manager, AI settings).
  grafanaUrl: https://grafana.customer.example
  ## EDIT: proxy. Uncomment these lines if the pod must reach the internet through an HTTP proxy, and
  ## replace PROXY-HOST:PORT. auth-service asks GitHub for the newest plugin version (License page) and may
  ## call Jira. It is a Node.js program: it uses the proxy only when NODE_USE_ENV_PROXY is 1. NO_PROXY must
  ## name every in-cluster address it calls: a short name such as `holmes` is not matched by `.svc`. If Jira
  ## is reached without the proxy, add its host name to NO_PROXY.
  # extraEnv:
  #   - {name: NODE_USE_ENV_PROXY, value: "1"}
  #   - {name: HTTPS_PROXY, value: "http://PROXY-HOST:PORT"}
  #   - {name: HTTP_PROXY, value: "http://PROXY-HOST:PORT"}
  #   - name: NO_PROXY
  #     value: "localhost,127.0.0.1,.svc,.cluster.local,\
  #       ai-gateway,holmes,inventory-service,lawrence,query-guard,alertmanager,\
  #       thanos-query,thanos-internal-query,loki-query-frontend,tempo-query-frontend,seaweedfs-master,\
  #       log-otel-enrichment-collector-extension,log-otel-enrichment-collector-monitoring,\
  #       metric-otel-enrichment-collector-extension,metric-otel-enrichment-collector-monitoring,\
  #       trace-otel-enrichment-collector-extension,trace-otel-enrichment-collector-monitoring"
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

lawrence:
  # Where collectors outside the cluster send their own metrics and logs:
  # https://<route-host>/ingest/opamp/v1/telemetry/  (keep the slash at the end)
  agentHttpEndpoint: https://ROUTE-HOST/ingest/opamp/v1/telemetry/
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

# Only on Kubernetes with an Ingress controller. On OpenShift, keep enabled: false and use a Route.
nginx:
  ingress:
    enabled: false
    className: nginx
    host: ROUTE-HOST
    annotations: {}
    tlsSecretName: ""
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}

# --- CPU and memory ------------------------------------------------------------------
# Sized for a handful of servers sending data, from a test: 8 minutes of 500 spans, 500 log lines and 200
# metric points per second from 10 services, plus dashboard-like queries, on a laptop cluster. The largest
# peaks were tempo-ingester 420 MiB, holmes 380 MiB and tempo-compactor 290 MiB; every memory limit is at
# least twice the peak, and every CPU limit more than twice. Every container must have requests and limits
# (OpenShift quotas refuse pods without them). If a pod is restarted with `OOMKilled`
# (kubectl -n iyzitrace get pods; kubectl -n iyzitrace describe pod <pod>), raise that component's memory
# limit here; a component that is slow and shows CPU at its limit (kubectl -n iyzitrace top pods) needs a
# higher CPU limit. More servers, or much longer queries, need more.

queryGuard:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 256Mi}
inventoryService:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
holmes:
  resources:
    requests: {cpu: 100m, memory: 320Mi}
    limits: {cpu: 1000m, memory: 1Gi}
aiGateway:
  ## EDIT: proxy. Uncomment these lines if ai-gateway must reach the AI provider (OpenAI, Azure OpenAI,
  ## Anthropic, ...) through an HTTP proxy, and replace PROXY-HOST:PORT. If the provider is on premises and
  ## reached without the proxy, add its host name to NO_PROXY.
  # extraEnv:
  #   - {name: HTTPS_PROXY, value: "http://PROXY-HOST:PORT"}
  #   - {name: HTTP_PROXY, value: "http://PROXY-HOST:PORT"}
  #   - {name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local,auth-service"}
  resources:
    requests: {cpu: 25m, memory: 160Mi}
    limits: {cpu: 250m, memory: 512Mi}
collectors:
  trace:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  metric:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  log:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
selfmon:
  resources:
    requests: {cpu: 25m, memory: 160Mi}
    limits: {cpu: 250m, memory: 512Mi}

