# MKK PoC settings: one file for the operators (step 5), the object store (step 6) and the platform
# (step 8) of README.md; each chart reads only the keys it knows. The registry and the proxy are already
# switched on. README.md, step 2, replaces these words in this file with your values:
#   REGISTRY          your registry's address
#   PROXY-HOST:PORT   your HTTP proxy
#   ROUTE-HOST        the platform's public host name (step 7)

authService:
  # The Grafana of this kit (README.md, step 10), as the cluster reaches it.
  # The platform checks Grafana administrators against it (Agent Manager, AI settings).
  grafanaUrl: http://grafana.iyzitrace-grafana.svc:3000
  extraEnv:
    - {name: NODE_USE_ENV_PROXY, value: "1"}
    - {name: HTTPS_PROXY, value: "http://PROXY-HOST:PORT"}
    - {name: HTTP_PROXY, value: "http://PROXY-HOST:PORT"}
    - name: NO_PROXY
      value: "localhost,127.0.0.1,.svc,.cluster.local,\
        ai-gateway,holmes,inventory-service,lawrence,query-guard,alertmanager,\
        thanos-query,thanos-internal-query,loki-query-frontend,tempo-query-frontend,seaweedfs-master,\
        log-otel-enrichment-collector-extension,log-otel-enrichment-collector-monitoring,\
        metric-otel-enrichment-collector-extension,metric-otel-enrichment-collector-monitoring,\
        trace-otel-enrichment-collector-extension,trace-otel-enrichment-collector-monitoring"
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 512Mi}

lawrence:
  # Where collectors outside the cluster send their own metrics and logs:
  # https://<route-host>/ingest/opamp/v1/telemetry/  (keep the slash at the end)
  agentHttpEndpoint: https://ROUTE-HOST/ingest/opamp/v1/telemetry/
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 256Mi}

# Only on Kubernetes with an Ingress controller. On OpenShift, keep enabled: false and use a Route.
nginx:
  ingress:
    enabled: false
    className: nginx
    host: ROUTE-HOST
    annotations: {}
    tlsSecretName: ""
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 250m, memory: 128Mi}

# --- CPU and memory ------------------------------------------------------------------
# Smaller than the chart's own values, which are small already: enough for a handful of
# servers sending data. Every container must have requests and limits (OpenShift quotas
# refuse pods without them). If a pod is restarted with `OOMKilled`
# (kubectl -n iyzitrace get pods; kubectl -n iyzitrace describe pod <pod>), raise that
# component's memory limit here; a component that is slow and shows CPU at its limit
# (kubectl -n iyzitrace top pods) needs a higher CPU limit.

queryGuard:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 250m, memory: 256Mi}
inventoryService:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 512Mi}
holmes:
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}
aiGateway:
  extraEnv:
    - {name: HTTPS_PROXY, value: "http://PROXY-HOST:PORT"}
    - {name: HTTP_PROXY, value: "http://PROXY-HOST:PORT"}
    - {name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local,auth-service"}
  resources:
    requests: {cpu: 10m, memory: 128Mi}
    limits: {cpu: 250m, memory: 512Mi}
collectors:
  trace:
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
  metric:
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
  log:
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
selfmon:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 100m, memory: 256Mi}

otelOperator:
  manager:
    image:
      repository: REGISTRY/ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator
    # The image a collector gets when its resource names none.
    collectorImage:
      repository: REGISTRY/docker.io/otel/opentelemetry-collector-contrib
  kubeRBACProxy:
    image:
      repository: REGISTRY/quay.io/brancz/kube-rbac-proxy
  # The pods `helm test` runs.
  testFramework:
    image:
      repository: REGISTRY/docker.io/library/busybox
seaweedfsOperator:
  image:
    registry: REGISTRY/docker.io/chrislusf

seaweedfs:
  image: REGISTRY/docker.io/chrislusf/seaweedfs:4.44

images:
  auth:
    repository: REGISTRY/ghcr.io/iyzitrace/auth-service
  lawrence:
    repository: REGISTRY/ghcr.io/iyzitrace/opamp
  inventory:
    repository: REGISTRY/ghcr.io/iyzitrace/inventory-service
  queryGuard:
    repository: REGISTRY/ghcr.io/iyzitrace/query-guard
  holmes:
    repository: REGISTRY/ghcr.io/iyzitrace/holmes
  nginx:
    repository: REGISTRY/docker.io/library/nginx
  otel:
    repository: REGISTRY/docker.io/otel/opentelemetry-collector-contrib
  curl:
    repository: REGISTRY/docker.io/curlimages/curl

x-wait-for-bucket:
  # Blocks a component that opens the object store until its own bucket answers
  # a signed HEAD with its own key, at $S3_ENDPOINT (helm/storage) — the Kubernetes counterpart of Compose's
  # `depends_on: seaweedfs-init: service_completed_successfully`. Unlike a Helm
  # hook it also gates every restart. 200 = bucket there and key valid, 404 =
  # bucket not yet created, 403 = wrong key.
  tempo: &waitTempo
    - name: wait-for-bucket
      image: REGISTRY/docker.io/curlimages/curl:8.8.0
      resources: &waitResources
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      command:
        - "sh"
        - "-c"
      args:
        - >-
          until [ "$(curl -s -o /dev/null -w '%{http_code}' -I --aws-sigv4 'aws:amz:us-east-1:s3'
          --user "$TEMPO_ACCESS_KEY:$TEMPO_SECRET_KEY" "$S3_ENDPOINT/tempo-data")" = 200 ];
          do echo 'waiting for bucket tempo-data'; sleep 2; done
      envFrom:
        - secretRef:
            name: iyzitrace-tempo-s3
        # S3_ENDPOINT, derived from the Seaweed resource (helm/storage).
        - configMapRef:
            name: iyzitrace-object-store
      securityContext: &waitSecurity
        runAsNonRoot: true
        runAsUser: 100
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
  loki: &waitLoki
    - name: wait-for-bucket
      image: REGISTRY/docker.io/curlimages/curl:8.8.0
      resources: *waitResources
      command:
        - "sh"
        - "-c"
      args:
        - >-
          until [ "$(curl -s -o /dev/null -w '%{http_code}' -I --aws-sigv4 'aws:amz:us-east-1:s3'
          --user "$LOKI_ACCESS_KEY:$LOKI_SECRET_KEY" "$S3_ENDPOINT/loki-data")" = 200 ];
          do echo 'waiting for bucket loki-data'; sleep 2; done
      envFrom:
        - secretRef:
            name: iyzitrace-loki-s3
        # S3_ENDPOINT, derived from the Seaweed resource (helm/storage).
        - configMapRef:
            name: iyzitrace-object-store
      securityContext: *waitSecurity
  thanos: &waitThanos
    - name: wait-for-bucket
      image: REGISTRY/docker.io/curlimages/curl:8.8.0
      resources: *waitResources
      command:
        - "sh"
        - "-c"
      args:
        - >-
          until [ "$(curl -s -o /dev/null -w '%{http_code}' -I --aws-sigv4 'aws:amz:us-east-1:s3'
          --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" "$S3_ENDPOINT/thanos-time-series")" = 200 ];
          do echo 'waiting for bucket thanos-time-series'; sleep 2; done
      envFrom:
        - secretRef:
            name: iyzitrace-thanos-s3
        # S3_ENDPOINT, derived from the Seaweed resource (helm/storage).
        - configMapRef:
            name: iyzitrace-object-store
      securityContext: *waitSecurity

# --- Object store: the iyzitrace-storage release -------------------------------
# The Seaweed resource of helm/storage, installed in this namespace first. The
# operator names its Services <name>-s3 and <name>-master, and every endpoint
# this chart hands out (Tempo, Loki, Thanos, auth-service) is derived from this
# name, so it must match that release's seaweedfs.name. The per-backend S3
# Secrets and the iyzitrace-object-store ConfigMap come from that release too.

tempo:
  global:
    image:
      registry: REGISTRY/docker.io
  ingester:
    initContainers: *waitTempo
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
  metricsGenerator:
    initContainers: *waitTempo
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
  distributor:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}
  querier:
    initContainers: *waitTempo
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}
  queryFrontend:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
  compactor:
    initContainers: *waitTempo
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}

loki:
  global:
    imageRegistry: REGISTRY/docker.io
  ingester:
    initContainers: *waitLoki
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
  compactor:
    initContainers: *waitLoki
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}
  distributor:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}
  querier:
    initContainers: *waitLoki
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}
  queryFrontend:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
  queryScheduler:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
  indexGateway:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}

thanos:
  global:
    image: &thanosImage
      registry: REGISTRY/ghcr.io
      repository: iyzitrace/thanos
  queryFrontend:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
  query:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}
  receive:
    extraInitContainers: *waitThanos
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
  storegateway:
    extraInitContainers: *waitThanos
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}
  compactor:
    extraInitContainers: *waitThanos
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
  ruler:
    extraInitContainers: *waitThanos
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}

thanosInternal:
  global:
    image: *thanosImage
  query:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 250m, memory: 256Mi}

alertmanager:
  image:
    repository: REGISTRY/quay.io/prometheus/alertmanager
  configmapReload:
    image:
      repository: REGISTRY/quay.io/prometheus-operator/prometheus-config-reloader
  resources:
    requests: {cpu: 5m, memory: 16Mi}
    limits: {cpu: 50m, memory: 64Mi}
