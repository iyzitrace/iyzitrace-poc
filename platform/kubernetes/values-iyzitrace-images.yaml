# Images published by hand to ghcr.io/iyzitrace while GitHub Actions is down.
# Built from antreklabs/iyzitrace-observability-platform dev at c44dd8f, linux/amd64 + linux/arm64.
# Use on top of the profile values, e.g.:
#   helm upgrade --install iyzitrace helm/platform -n iyzitrace \
#     -f helm/platform/values-minikube.yaml -f values-iyzitrace-images.yaml --wait --timeout 15m
