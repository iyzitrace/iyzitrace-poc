# cert-manager for the MKK PoC (step 3 of README.md): its custom resource definitions, small CPU and memory
# requests and limits on every pod, as OpenShift quotas require, and its images from your registry.
# README.md, step 2, replaces REGISTRY in this file with your registry's address.

crds:
  enabled: true
image:
  repository: REGISTRY/quay.io/jetstack/cert-manager-controller

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {cpu: 250m, memory: 256Mi}

webhook:
  image:
    repository: REGISTRY/quay.io/jetstack/cert-manager-webhook
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}

cainjector:
  image:
    repository: REGISTRY/quay.io/jetstack/cert-manager-cainjector
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 250m, memory: 256Mi}

# The Job that checks cert-manager is answering after the install.
startupapicheck:
  image:
    repository: REGISTRY/quay.io/jetstack/cert-manager-startupapicheck
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}

acmesolver:
  image:
    repository: REGISTRY/quay.io/jetstack/cert-manager-acmesolver
