# The IBM MQ lab: two queue managers, one Linux machine with WildFly and the collector, and the IBM MQ
# metrics container next to it, sending to a running IyziTrace. See README.md in this folder.
name: iyzitrace-ibm-mq-lab

services:
  qm1: &qm
    build:
      context: ../..
      dockerfile: test/ibm-mq/mq/Dockerfile
    image: iyzitrace-poc-ibm-mq:9.4.5.1-r1
    platform: linux/amd64
    hostname: qm1
    environment: &qm-env
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_CONNAUTH_USE_HTP: "true"
      MQ_ENABLE_EMBEDDED_WEB_SERVER: "false"
    secrets: [mqAppPassword, mqAdminPassword]
    volumes:
      - qm1-data:/mnt/mqm
      - ./mq/qm1-channels.mqsc:/etc/mqm/92-channels.mqsc:ro

  qm2:
    <<: *qm
    hostname: qm2
    environment:
      <<: *qm-env
      MQ_QMGR_NAME: QM2
    volumes:
      - qm2-data:/mnt/mqm
      - ./mq/qm2-channels.mqsc:/etc/mqm/92-channels.mqsc:ro

  host:
    build:
      context: ../..
      dockerfile: test/ibm-mq/host/Dockerfile
    image: iyzitrace-poc-ibm-mq-host
    platform: linux/amd64
    hostname: poc-mq-01
    # IYZITRACE_INGEST_URL and IYZITRACE_API_KEY (the department's agent key).
    env_file: .env
    secrets: [mqAppPassword]
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [qm1, qm2]

  # docs/07-ibm-mq.md step 2: the published image with one config file. It shares the Linux
  # machine's network, as `docker run --network host` does there, so 127.0.0.1:4317 is that
  # machine's collector.
  ibm-mq-metrics:
    image: ghcr.io/antreklabs/ibm-mq-metrics:dev-c97d56dab294d8e2757d579fecd48ceedf68803a
    network_mode: "service:host"
    restart: unless-stopped
    volumes:
      - ./ibm-mq-metrics.yml:/etc/ibm-mq-metrics/config.yml:ro
    depends_on: [host]

secrets:
  mqAppPassword:
    file: ./secrets/mqAppPassword
  mqAdminPassword:
    file: ./secrets/mqAdminPassword

volumes:
  qm1-data:
  qm2-data:
